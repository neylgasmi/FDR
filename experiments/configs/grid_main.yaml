n_steps: 2000
frequencies_seconds: [1, 5, 30, 60, 300]
jump_regimes: [rare, moderate, hawkes_dense]
jump_sizes_in_sigma: [3, 5]        # "mixed" deferred: requires runner support for variable sizes
alpha: [0.05, 0.10]
wealth_fractions: [0.0005, 0.0025, 0.005, 0.05]  # GAI-family (elord, esaffron) only
# w1=O(1/n) per e-GAI paper: 1/2000=0.0005, 5/2000=0.0025 are canonical.
# [0.005] was validated safe for n=500 in grid_quick.
# [0.05] tests moderate alpha-death onset.
# [0.1, 0.25, 0.5, 0.75] all cause alpha-death at n=2000 (confirmed on grid_medium).
M_replications: 500
algorithms: [ebh, bh_lm, bh_bns, elond, elord, esaffron, stopped_ebh]
estimators: [medrv]
